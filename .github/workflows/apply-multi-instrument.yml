name: Apply multi-instrument integration

on:
  push:
    branches: [moonlit-reverie-video]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moonlit-reverie-video
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded source patch
        run: node scripts/apply-multi-instrument-patch.mjs
      - name: Remove temporary patch runner
        run: rm -f scripts/apply-multi-instrument-patch.mjs .github/workflows/apply-multi-instrument.yml
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: add per-track instrument playback"
            git push origin HEAD:moonlit-reverie-video
          fi
