name: Verify Moonlit branch

on:
  push:
    branches:
      - moonlit-reverie-video
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply SpessaSynth routing migration
        run: node scripts/apply-spessa-routing.mjs

      - name: Install dependencies and refresh lockfile
        run: npm install

      - name: Verify GeneralUser fetch script
        run: bash -n scripts/fetch-generaluser-gs.sh

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit verified migration and lockfile
        if: success()
        run: |
          if git diff --quiet -- src/audio/instrumentCatalog.ts src/audio/instrumentRack.ts src/export/renderAudio.ts package-lock.json; then
            echo ">> verified migration already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audio/instrumentCatalog.ts src/audio/instrumentRack.ts src/export/renderAudio.ts package-lock.json
          git commit -m "feat: route drums through SpessaSynth kits"
          git push
