name: Verify Moonlit branch

on:
  push:
    branches:
      - moonlit-reverie-video
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Capture dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sf2-package-lock
          path: package-lock.json
          if-no-files-found: error
