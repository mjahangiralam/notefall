name: Apply automatic track colors

on:
  push:
    branches: [moonlit-reverie-video]
    paths:
      - '.github/workflows/apply-track-colors.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moonlit-reverie-video
      - name: Apply guarded source patch
        run: node scripts/apply-track-colors.mjs
      - name: Remove temporary patch files
        run: |
          git rm scripts/apply-track-colors.mjs
          git rm .github/workflows/apply-track-colors.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store.ts
          git commit -m "fix: auto-color multi-track MIDI"
          git push
