name: Deploy GeneralUser SF2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch pinned GeneralUser GS 2.0.3
        run: bash scripts/fetch-generaluser-gs.sh

      - name: Verify downloaded bank size
        run: |
          set -euo pipefail
          file="public/samples/generaluser-gs-2.0.3/GeneralUser-GS.sf2"
          test -f "$file"
          size=$(wc -c < "$file" | tr -d ' ')
          test "$size" -ge 25000000
          echo ">> verified local GeneralUser GS asset ($size bytes)"

      - name: Check production object
        id: cdn
        run: |
          set -euo pipefail
          url="https://samples.notefall.app/generaluser-gs-2.0.3/GeneralUser-GS.sf2"
          headers="$(mktemp)"
          if curl --fail --silent --show-error --location --head --dump-header "$headers" --output /dev/null "$url" \
            && grep -Eiq '^cache-control:.*max-age=31536000.*immutable' "$headers"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo ">> production object already exists with immutable caching"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo ">> production object is missing or does not yet have immutable caching"
          fi

      - name: Verify R2 credentials are configured
        if: steps.cdn.outputs.exists != 'true'
        run: |
          set -euo pipefail
          for var in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!var:-}" ]; then
              echo "::error::$var is not configured as a repository secret"
              exit 1
            fi
          done

      - name: Upload versioned SF2 to R2
        if: steps.cdn.outputs.exists != 'true'
        run: bash scripts/upload-generaluser-gs-r2.sh

      - name: Verify production object
        run: |
          set -euo pipefail
          url="https://samples.notefall.app/generaluser-gs-2.0.3/GeneralUser-GS.sf2"
          headers="$(mktemp)"
          curl --fail --silent --show-error --location --head --dump-header "$headers" --output /dev/null "$url"
          grep -Eiq '^cache-control:.*max-age=31536000.*immutable' "$headers"
          echo ">> verified $url"
