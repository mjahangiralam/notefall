name: Apply track instrument reset fix

on:
  push:
    branches: [moonlit-reverie-video]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moonlit-reverie-video
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded reset patch
        run: node scripts/fix-track-instrument-reset.mjs
      - name: Remove temporary patch files
        run: rm -f scripts/fix-track-instrument-reset.mjs .github/workflows/fix-track-instrument-reset.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: reset per-track instruments with new MIDI"
            git push origin HEAD:moonlit-reverie-video
          fi
